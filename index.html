`<p class="eyebrow">FOR MY NONTI ♡</p><div class="date">11/11</div><div class="time">11:11</div><div class="heart">✧ ♡ ✧</div><h1 class="title">إنتِ أحلى حكاية<br>في حياتي</h1><p class="desc">يا حبيبتي ويا نور عيني.. دي حكاية صغيرة شايلة جواها حب كبير أوي ليكي. يلا افتحيها واحدة واحدة، عشان كل كلمة فيها طالعة من قلبي ليكي.</p><button class="btn" onclick="start()">يلا يا حبيبتي.. افتحي المفاجأة ♡</button><div class="small">معمولة بحب.. مخصوص ليكي</div>`,
`<p class="eyebrow">OUR MOMENT · لحظتنا</p><div class="date">11/11</div><div class="time">11:11</div><h2 class="title">اليوم اللي قلتلك فيه بحبك</h2><article class="letter"><p>فاكرة اليوم ده يا حبيبتي؟ يوم ما قلتلك بحبك، واليوم اللي بقينا فيه لبعض. من ساعتها والتاريخ ده بقى عندي مش مجرد رقم.. ده اليوم اللي قلبي اختار فيه أحلى حكاية.</p><p>مش عارف أوصفلك الإحساس كان عامل إزاي، بس كل اللي عارفه إن وجودك في حياتي بقى حاجة غالية عليا أوي. إنتِ حبيبتي، ونور عيني، والحد اللي نفسي أحكيله كل حاجة حلوة تحصللي، وكل حاجة تضايقني كمان.</p><p>بحبك يا حبيبتي، وبحب إن لينا حكاية تخصنا إحنا، وبتمنا من قلبي إننا نفضل جنب بعض ونكمّل العمر سوا، يوم ورا يوم وحكاية ورا حكاية. ❤️</p></article><button class="btn" onclick="next()">تعالي نكمّل حكايتنا ←</button>`,
`<p class="eyebrow">CHAPTER 01 · حكايتنا</p><h2 class="title">أول صدفة بينا</h2><div class="photo flip" onclick="flipMemory(this)" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')this.click()"><img src="three.jpg" alt="صورة للذكرى الأولى"><div class="backface">يا حتة مني.. صدفة واحدة جابتلي حكاية نفسي تكمل طول العمر ❤️</div><span>♡ اضغطي عليّا</span></div><p class="caption">الصورة مخبّية كلام.. دوسي عليها ♡</p><article class="letter"><p>مين كان يصدق إن صدفة صغيرة ممكن يبقى وراها كل الحب ده؟ يمكن الدنيا عادية حوالينا، بس إنتِ دخلتيها وخليتي ليها طعم تاني يا حبيبتي.</p><p>بحب وجودك في يومي، وبحب إن وسط دوشة الدنيا فيه حد أول ما أكلمه قلبي يروق. إنتِ حبيبتي والصدفة اللي بحمد ربنا عليها، والونس اللي نفسي يفضل معايا على طول. ومعلش بقى، قلبي اختارك ومش ناوي يرجّعك 😂❤️</p></article><button class="btn" onclick="next()">واللي بعده؟ ←</button>`,
`<p class="eyebrow">CHAPTER 02 · حكايتنا</p><h2 class="title">أول مقابلة لينا</h2><div class="photo flip" onclick="flipMemory(this)" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')this.click()"><img src="one.jpg" alt="صورة ظل الذكرى"><div class="backface">أول مقابلة لينا ليها حتة في قلبي.. ولسه كل مقابلة معاكي بتفرّحني كأنها أول مرة ❤️</div><span>♡ اضغطي عليّا</span></div><p class="caption">ووراء الصورة دي كمان رسالة ليكي ♡</p><article class="letter"><p>أول مقابلة لينا ليها حتة خاصة في قلبي يا حبيبتي. يمكن الكلام وقتها ما كانش كفاية، بس الفرحة اللي جوايا كانت أكبر من أي كلام.</p><p>كل ما بفتكر إننا بقينا في حياة بعض، بحس قد إيه وجودك غالي عليا. نفسي أفضل أشوفك مبسوطة، وأبقى أنا اللي يضحكك ويطمنك.. حتى لو هنختلف مين فينا بيحب التاني أكتر، مع إن الإجابة معروفة طبعًا: أنا 😌❤️</p></article><button class="btn" onclick="next()">لسه في حكايات ←</button>`,

`<p class="eyebrow">FROM MY HEART · من قلبي</p><div class="heart">✧ ♡ ✧</div><h2 class="title">عايز أقولك حاجة<br>يا حبيبتي</h2><article class="letter"><p>أنا عارف إني مقصّر معاكي الفترة الأخيرة، وعارف إن في أوقات بتعصب عليكي وبضايقك. حقك عليا يا حبيبتي، وإنتِ ما تستاهليش مني غير الحنية والكلام اللي يفرّح قلبك.</p><p>إنتِ عارفة أنا بحبك قد إيه، بس الحب مش كلام وبس، وأنا عايز أبقى أهدى وأسمعك أكتر وأخليكي تحسي بحبي في تصرفاتي كمان. لو زعلتك في يوم، أتمنى تسامحيني، وأنا هحاول أصلّح وأبقى أحسن عشانك وعشاننا.</p><p>ربنا يخليكي ليا يا نور عيني، ويفضل بينا الود والضحكة والكلام اللي بيطمن القلب. إنتِ غالية عليا أوي يا حبيبتي. ❤️</p></article><button class="btn" onclick="next()">كمّلي يا روحي ←</button>`,

`<p class="eyebrow">ALWAYS YOU · 11/11</p><div class="heart">✧ ♡ ✧</div><h2 class="title">يا نور عيني.. يا حبيبتي</h2><article class="letter"><p>إنتِ حبيبتي وونسي ونور عيني، والحد اللي نفسي أشاركه أيامي كلها. نفسي نفضل ماسكين في بعض، نفرح لبعض ونهوّن على بعض، ونعدّي أي يوم صعب وإيدينا في إيد بعض.</p><p>ربنا يخليكي ليا يا أحلى حاجة في حياتي، ويخليني دايمًا سبب في ضحكتك. بحبك حب كبير، ونفسي أكمل معاكي بقية عمري، ونكتب حكايات كتير أحلى من اللي فات. ❤️</p><p>معمول بحب مخصوص لحبيبتي..<br><b>من أبو العيال، محمد ❤️</b></p></article><button class="btn" onclick="go(0)">نعيش الحكاية تاني ↻</button>`];
function render(){document.querySelector('.little-girl')?.remove();stage.innerHTML=pages[index];if([2,3,4].includes(index)){const g=document.createElement('div');g.className='little-girl';g.setAttribute('aria-hidden','true');g.innerHTML='<i class="hair"></i><i class="face"></i><i class="dress"></i><i class="arm"></i><i class="leg"></i><i class="leg two"></i>';document.body.appendChild(g);g.addEventListener('animationend',()=>g.remove(),{once:true})}stage.style.animation='none';void stage.offsetWidth;stage.style.animation='';progress.innerHTML=pages.map((_,i)=>`<i class="${i<=index?'on':''}"></i>`).join('');counter.textContent=(index+1)+' / '+pages.length;back.style.visibility=index?'visible':'hidden'}function go(i){if(i===0)openedMemories.clear();index=i;render()}function flipMemory(el){el.classList.toggle('flipped');if(el.classList.contains('flipped')){openedMemories.add(index);toast('أيوه كده يا حبيبتي.. ورا كل صورة حكاية ❤️')}}function next(){if([2,3,4].includes(index)&&!openedMemories.has(index)){const msgs={2:'استني مستعجلة ليه؟ 😂 اضغطي على الصورة الأول.. هتهربي مني فين يا حبيبتي؟',3:'إيه ده، نسيتي تضغطي على الصورة ولا إيه؟ 😂 دوسي عليها وشوفي اللي مستخبي وراها ❤️',4:'طبعًا مش هقولك كل مرة اضغطي على الصورة.. إنتِ مش ناقصة غباء 😂❤️'};toast(msgs[index]);return}if(index<pages.length-1){index++;render();toast(['ربنا يخليكي ليا يا أحلى حاجة في حياتي ❤️','براحة شوية على الشاشة يا حبيبتي.. مش بتاعتنا 😂❤️','يا نور عيني.. إنتِ غالية أوي عندي ❤️','بحبك يا حبيبتي، أكتر ما الكلام يقدر يقول ♡'][index%4]);if(index===5)sideNote()}}function start(){play();next()}back.onclick=()=>go(Math.max(0,index-1));function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}function sideNote(){const n=document.createElement('div');n.className='side-note';n.textContent='عارف إني قصّرت معاكي يا حبيبتي.. حقك عليا يا حبيبتي ❤️';document.body.appendChild(n);setTimeout(()=>n.remove(),5500)}function reveal(){document.querySelector('#answer').textContent='أنا بس عارف إن وجودك في حياتي بقى من أحلى الحاجات يا حبيبتي ❤️'}function reason(i){document.querySelector('#reason').textContent=['عشان وجودك بيخلّي يومي أحنّ.. حتى لما تكسبي النقاش كالعادة 😂♡','عشان إنتِ حبيبتي وحبيبتي.. ودي لوحدها حكاية كبيرة ♡','عشان قلبي اختارك، ولسه بيختارك كل يوم ♡'][i]}let musicStarted=false;function play(){const player=document.querySelector('#player');if(!musicStarted){player.currentTime=60;musicStarted=true}player.play().then(()=>{document.querySelector('#sound').textContent='♫ إيقاف الأغنية'}).catch(()=>{document.querySelector('#sound').textContent='♫ شغّلي الأغنية';toast('اضغطي على زر الأغنية عشان تشتغل ♫')})}document.querySelector('#sound').onclick=()=>{const player=document.querySelector('#player');if(player.paused){play()}else{player.pause();document.querySelector('#sound').textContent='♫ شغّلي الأغنية'}};document.querySelector('#player').addEventListener('ended',()=>{document.querySelector('#sound').textContent='♫ شغّلي الأغنية'});render();
